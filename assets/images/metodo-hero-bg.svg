  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="28" fill="#153853" opacity="0.28" letter-spacing="4">IMMAGINE SEGNAPOSTO</text>
</svg>
