<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Facciata di un edificio verso il cielo, immagine segnaposto">
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0%" stop-color="#1453A4"/>
      <stop offset="55%" stop-color="#7FA8D6"/>
