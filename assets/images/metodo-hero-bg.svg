  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g opacity="0.22" stroke="#153853" stroke-width="2" fill="none">
    <line x1="120" y1="0" x2="420" y2="900"/>
    <line x1="260" y1="0" x2="560" y2="900"/>
    <line x1="0" y1="120" x2="500" y2="900"/>
    <line x1="900" y1="0" x2="1200" y2="900"/>
    <line x1="1050" y1="0" x2="1350" y2="900"/>
