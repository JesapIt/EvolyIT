    <rect x="1340" y="500" width="150" height="220"/>
  </g>
  <g opacity="0.5">
    <rect x="0" y="0" width="1600" height="900" fill="#000000" opacity="0.15"/>
  </g>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.25" letter-spacing="4">IMMAGINE SEGNAPOSTO</text>
</svg>
