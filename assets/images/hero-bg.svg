<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sala riunioni, immagine segnaposto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1e21"/>
      <stop offset="100%" stop-color="#132f32"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1453A4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#08875B" stop-opacity="0.10"/>
